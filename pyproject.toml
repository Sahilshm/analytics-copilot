[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-analytics-copilot"
version = "0.1.0"
description = "Cloud-first multi-agent analytics copilot with FastAPI, MCP-style tools, BigQuery, and Vertex AI adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "matplotlib>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
adk = [
  "google-adk>=1.14.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]
cloud = [
  "google-cloud-bigquery>=3.25.0,<4.0.0",
  "google-cloud-aiplatform>=1.71.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
